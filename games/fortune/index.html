<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortune Tigre | StratonPay Bets</title>
<link rel="icon" href="../../public/logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:Inter,system-ui,sans-serif}
body{background:#160e02;color:#fff}
.reel{background:#241a08;border:1px solid rgba(255,255,255,.12)}
.sym{font-size:44px;font-weight:900;line-height:1}
.btn-spin{background:#eab308;color:#111;box-shadow:0 6px 0 #92400e}
.btn-spin:active{transform:translateY(3px);box-shadow:0 3px 0 #92400e}
.btn-spin:disabled{opacity:.5}
input{color:#111}
.spin{animation:blur .12s linear infinite}
@keyframes blur{0%{transform:translateY(-6px);opacity:.5}100%{transform:translateY(6px);opacity:1}}
</style>
</head>
<body class="min-h-screen">
<header class="h-14 bg-[#241a08] border-b border-white/10 flex items-center justify-between px-4 sticky top-0 z-10">
  <a href="../index.html" class="flex items-center gap-2">
    <img src="../../public/logo.png" class="w-8 h-8 rounded-lg object-cover" alt="StratonPay">
    <span class="font-extrabold">Fortune Tigre</span>
  </a>
  <div class="flex items-center gap-2">
    <div class="bg-black/40 px-3 py-1.5 rounded-full border border-white/10 text-sm">Saldo <b id="saldo">R$ 100,00</b></div>
    <a href="../index.html" class="px-3 py-1.5 bg-white text-black rounded-full text-xs font-bold">Jogos</a>
  </div>
</header>

<main class="max-w-[520px] mx-auto p-4 pb-10">
  <div class="bg-[#241a08] rounded-2xl p-4 border border-[#eab308]/30 text-center">
    <p class="text-xs font-bold text-[#eab308] tracking-widest">JACKPOT ACUMULADO</p>
    <p id="jack" class="text-3xl font-black text-yellow-300 tabular-nums">R$ 0,00</p>
    <div class="grid grid-cols-3 gap-2 mt-4">
      <div class="reel rounded-2xl py-8"><div class="sym" id="r0">7</div></div>
      <div class="reel rounded-2xl py-8"><div class="sym" id="r1">$</div></div>
      <div class="reel rounded-2xl py-8"><div class="sym" id="r2">T</div></div>
    </div>
    <p id="msg" class="text-sm mt-3 text-white/70">3 simbolos iguais = premio. 7 paga 10x.</p>
  </div>

  <div class="bg-[#241a08] rounded-2xl p-4 mt-3 border border-white/10">
    <div class="flex items-center gap-2">
      <button id="btnMinus" class="w-10 h-11 rounded-xl bg-white/10 font-black">-</button>
      <input id="valor" type="number" value="5" min="1" class="h-11 w-full rounded-xl px-3 text-sm text-black">
      <button id="btnPlus" class="w-10 h-11 rounded-xl bg-white/10 font-black">+</button>
    </div>
    <div class="flex gap-2 mt-2 text-xs font-bold">
      <button id="btnHalf" class="flex-1 h-8 rounded-full bg-white/10">1/2</button>
      <button id="btnDouble" class="flex-1 h-8 rounded-full bg-white/10">x2</button>
      <button id="btnMax" class="flex-1 h-8 rounded-full bg-white/10">MAX</button>
    </div>
    <button id="btnGo" class="btn-spin w-full h-12 rounded-xl font-black text-sm mt-3">GIRAR</button>
    <div class="grid grid-cols-4 gap-1 mt-3 text-center text-[11px]">
      <div class="bg-white/5 rounded-lg py-1.5"><b>7 7 7</b><br><span class="text-yellow-300">10x</span></div>
      <div class="bg-white/5 rounded-lg py-1.5"><b>$ $ $</b><br><span class="text-yellow-300">5x</span></div>
      <div class="bg-white/5 rounded-lg py-1.5"><b>T T T</b><br><span class="text-yellow-300">3x</span></div>
      <div class="bg-white/5 rounded-lg py-1.5"><b>par</b><br><span class="text-yellow-300">0.4x</span></div>
    </div>
  </div>
  <div id="hist" class="flex gap-1.5 mt-3 flex-wrap justify-center text-xs"></div>
  <p class="text-[11px] text-white/40 mt-3 text-center">Jogue com responsabilidade. Mais 18.</p>
</main>

<script type="module">
const params = new URLSearchParams(location.search);
const platformId = params.get('platform') || 'demo';
const PKEY = 'player_' + platformId;
const fmt = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let saldo = 100;
try{ const p = JSON.parse(localStorage.getItem(PKEY)||'null'); if(p && typeof p.saldo === 'number') saldo = p.saldo; }catch{}
function save(){ try{ const p = JSON.parse(localStorage.getItem(PKEY)||'{}'); p.saldo = saldo; localStorage.setItem(PKEY, JSON.stringify(p)); }catch{} document.getElementById('saldo').textContent = fmt(saldo); }
async function logBet(b){ try{ const m = await import('../../supabase.js'); await m.sbCreateBet({ platform_id: platformId, jogo:'fortune', ...b }); }catch{} }
save();

let JACK = 59780152.94;
const jackEl = document.getElementById('jack');
setInterval(()=>{ JACK += Math.random()*300; jackEl.textContent = fmt(JACK); }, 2500);
jackEl.textContent = fmt(JACK);

const SYMS = [
  { s:'7', w:8, color:'#facc15' },
  { s:'$', w:14, color:'#4ade80' },
  { s:'T', w:22, color:'#f87171' },
  { s:'D', w:26, color:'#60a5fa' },
  { s:'O', w:30, color:'#c084fc' }
];
function drawSym(){
  const tot = SYMS.reduce((a,b)=>a+b.w,0);
  let x = Math.random()*tot;
  for(const o of SYMS){ x -= o.w; if(x <= 0) return o; }
  return SYMS[SYMS.length-1];
}
const rEls = [document.getElementById('r0'), document.getElementById('r1'), document.getElementById('r2')];
const msgEl = document.getElementById('msg'), valorEl = document.getElementById('valor'), btnGo = document.getElementById('btnGo');
let girando = false;
function pushHist(win, txt){
  const d = document.createElement('span');
  d.className = 'px-2 py-1 rounded-full font-bold ' + (win ? 'bg-yellow-500/25 text-yellow-200' : 'bg-white/10 text-white/50');
  d.textContent = txt;
  const h = document.getElementById('hist');
  h.prepend(d);
  while(h.children.length > 20) h.lastChild.remove();
}
document.getElementById('btnMinus').onclick = ()=>{ valorEl.value = Math.max(1, Number(valorEl.value||1)-1); };
document.getElementById('btnPlus').onclick = ()=>{ valorEl.value = Math.min(500, Number(valorEl.value||1)+1); };
document.getElementById('btnHalf').onclick = ()=>{ valorEl.value = Math.max(1, Math.floor(Number(valorEl.value||2)/2)); };
document.getElementById('btnDouble').onclick = ()=>{ valorEl.value = Math.min(500, Number(valorEl.value||1)*2); };
document.getElementById('btnMax').onclick = ()=>{ valorEl.value = Math.min(500, Math.max(1, Math.floor(saldo))); };

btnGo.onclick = ()=>{
  if(girando) return;
  const v = Number(valorEl.value||0);
  if(!(v>0)){ alert('Informe o valor'); return; }
  if(v > saldo){ alert('Saldo insuficiente. Deposite para continuar.'); return; }
  saldo = Math.round((saldo - v)*100)/100; save();
  girando = true; btnGo.disabled = true;
  rEls.forEach(e=>e.classList.add('spin'));
  msgEl.textContent = 'Girando...';
  const winRoll = Math.random();
  let out;
  if(winRoll < 0.06){
    const t = ['7','$','T'][Math.floor(Math.random()*3)];
    const o = SYMS.find(x=>x.s===t);
    out = [o,o,o];
  } else if(winRoll < 0.18){
    const o = SYMS[2+Math.floor(Math.random()*3)];
    const other = SYMS[Math.floor(Math.random()*SYMS.length)];
    out = [o,o,other].sort(()=>Math.random()-.5);
  } else {
    out = [drawSym(),drawSym(),drawSym()];
    if(out[0].s===out[1].s && out[1].s===out[2].s && Math.random()<0.7) out[2] = SYMS[(SYMS.indexOf(out[2])+1)%SYMS.length];
  }
  let n = 0;
  const tick = setInterval(()=>{
    rEls.forEach(e=>{ const o = drawSym(); e.textContent = o.s; e.style.color = o.color; });
    if(++n >= 10){
      clearInterval(tick);
      rEls.forEach((e,i)=>{ e.classList.remove('spin'); e.textContent = out[i].s; e.style.color = out[i].color; });
      const [a,b,c] = out.map(o=>o.s);
      let mult = 0;
      if(a===b && b===c) mult = a==='7' ? 10 : a==='$' ? 5 : a==='T' ? 3 : 2;
      else if(a===b || b===c || a===c) mult = 0.4;
      if(mult > 0){
        const ret = Math.round(v*mult*100)/100;
        saldo = Math.round((saldo+ret)*100)/100; save();
        msgEl.textContent = 'Premio ' + mult + 'x. Retorno ' + fmt(ret) + '.';
        logBet({ valor: v, multiplicador: mult, retorno: ret, resultado: 'win' });
        pushHist(true, '+' + mult + 'x');
      } else {
        msgEl.textContent = 'Sem combinacao. Voce perdeu ' + fmt(v) + '.';
        logBet({ valor: v, multiplicador: 0, retorno: 0, resultado: 'loss' });
        pushHist(false, '-' + fmt(v));
      }
      girando = false; btnGo.disabled = false;
    }
  }, 90);
};
</script>
</body>
</html>
