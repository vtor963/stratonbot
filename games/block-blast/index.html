<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Blast | StratonPay Bets</title>
<link rel="icon" href="../../public/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:Inter,sans-serif}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cell{aspect-ratio:1/1;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.06)}
.cell.filled{box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.c0{background:#e5e5e5}.c1{background:#a3a3a3}.c2{background:#525252}.c3{background:#fafafa}.c4{background:#737373}
.cell.clear{outline:2px solid #fff;opacity:.4}
#board.playing{opacity:.55;pointer-events:none}
</style>
</head>
<body class="bg-black min-h-screen text-white flex flex-col">
<header class="h-14 bg-zinc-950 border-b border-white/10 flex items-center justify-between px-4 sticky top-0 z-10">
  <a href="../../dashboard.html" class="flex items-center gap-2">
    <img src="../../public/logo.png" class="w-8 h-8 rounded-lg object-cover" alt="StratonPay Bets">
    <span class="font-extrabold">StratonPay Bets</span>
  </a>
  <div class="flex items-center gap-2">
    <div class="bg-zinc-900 px-3 py-1.5 rounded-full flex items-center gap-2 border border-white/10">
      <span class="text-xs text-zinc-400">Saldo</span><span id="saldo" class="text-sm font-extrabold">R$ 100,00</span>
    </div>
    <a href="../../dashboard.html" class="px-3 py-1.5 bg-white text-black rounded-full text-xs font-bold">Voltar</a>
  </div>
</header>

<div id="authBar" class="hidden bg-zinc-900 border-b border-white/10 px-4 py-2 text-xs text-center">
  <span class="text-zinc-400">Você não está logado.</span>
  <a href="../../index.html" class="font-bold underline ml-1">Entrar</a>
  <span class="text-zinc-600 mx-1">|</span>
  <a href="../../sign-up.html" class="font-bold underline">Criar conta</a>
</div>

<main class="flex-1 max-w-[960px] mx-auto w-full p-3 sm:p-4 grid lg:grid-cols-[320px_1fr] gap-4">
  <section class="bg-zinc-950 rounded-2xl p-4 border border-white/10 h-fit">
    <div class="bg-white text-black rounded-xl p-3 text-center">
      <p class="text-xs font-bold text-zinc-500">BLOCK BLAST</p>
      <p class="text-lg font-black">StratonPay Edition</p>
      <p class="text-[11px] text-zinc-500">Complete linhas para ganhar • RTP 96,5%</p>
    </div>
    <div class="mt-4">
      <label class="text-xs font-bold text-zinc-400">Valor da aposta</label>
      <div class="mt-1 flex items-center gap-2 bg-zinc-900 rounded-xl p-1 border border-white/10">
        <button id="betMinus" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 grid place-items-center font-bold" aria-label="Diminuir aposta">−</button>
        <span id="betVal" class="flex-1 text-center font-extrabold">R$ 2,00</span>
        <button id="betPlus" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 grid place-items-center font-bold" aria-label="Aumentar aposta">+</button>
      </div>
      <div class="grid grid-cols-4 gap-1 mt-2">
        <button data-bet="1" class="betQuick py-1.5 bg-white/5 hover:bg-white/10 rounded-lg text-xs font-bold">1</button>
        <button data-bet="2" class="betQuick py-1.5 bg-white/5 hover:bg-white/10 rounded-lg text-xs font-bold">2</button>
        <button data-bet="5" class="betQuick py-1.5 bg-white/5 hover:bg-white/10 rounded-lg text-xs font-bold">5</button>
        <button data-bet="10" class="betQuick py-1.5 bg-white/5 hover:bg-white/10 rounded-lg text-xs font-bold">10</button>
      </div>
    </div>
    <button id="btnGirar" class="w-full mt-4 py-3 bg-white text-black rounded-xl font-black hover:bg-zinc-200 active:scale-[0.98] transition disabled:opacity-50">GIRAR</button>
    <p id="msg" class="text-xs text-center text-zinc-400 h-4 mt-2"></p>
    <div class="bg-zinc-900 rounded-xl p-3 border border-white/5 mt-2">
      <p class="text-xs font-bold">Últimas rodadas</p>
      <div id="historico" class="mt-2 space-y-1 text-xs text-zinc-400 max-h-28 overflow-auto">
        <p class="text-zinc-600">Nenhuma rodada ainda.</p>
      </div>
    </div>
  </section>

  <section class="bg-zinc-950 rounded-2xl overflow-hidden border border-white/10 flex flex-col">
    <div class="h-11 bg-zinc-900 flex items-center justify-between px-3 border-b border-white/5">
      <span class="font-bold text-sm">Block Blast</span>
      <span id="roundInfo" class="text-[11px] text-zinc-400">Rodada #0</span>
    </div>
    <div class="flex-1 p-3 bg-black flex flex-col items-center">
      <div id="board" class="w-full max-w-[440px] bg-zinc-950 p-2 rounded-xl border border-white/10"></div>
      <p class="text-[11px] text-zinc-500 mt-2">Linha ou coluna cheia limpa e paga. Multiplica por linhas simultâneas.</p>
    </div>
  </section>
</main>

<script>
(function(){
  var BETS=[1,2,5,10,20,50];
  var bet=2, saldo=100, round=0, history=[];
  var boardEl=document.getElementById('board');
  var saldoEl=document.getElementById('saldo');
  var betEl=document.getElementById('betVal');
  var msgEl=document.getElementById('msg');
  var histEl=document.getElementById('historico');
  var roundEl=document.getElementById('roundInfo');
  var btn=document.getElementById('btnGirar');
  var grid=[];

  function ownerKey(){
    try{
      var u=JSON.parse(localStorage.getItem('profits_user')||'{}');
      return 'straton_saldo_'+((u.email||'anon').toLowerCase());
    }catch(e){ return 'straton_saldo_anon'; }
  }
  function fmt(v){ return 'R$ '+v.toFixed(2).replace('.',','); }
  function paint(){
    saldoEl.textContent=fmt(saldo);
    betEl.textContent=fmt(bet);
    roundEl.textContent='Rodada #'+round;
  }
  function emptyGrid(){ grid=[]; for(var i=0;i<64;i++) grid.push(-1); }
  function render(clearIdx){
    clearIdx=clearIdx||[];
    var html='';
    for(var i=0;i<64;i++){
      var cls='cell';
      if(grid[i]>=0) cls+=' filled c'+(grid[i]%5);
      if(clearIdx.indexOf(i)>=0) cls+=' clear';
      html+='<div class="'+cls+'"></div>';
    }
    boardEl.innerHTML=html;
  }
  function fillRandom(){
    for(var i=0;i<64;i++){
      if(Math.random()<0.72) grid[i]=Math.floor(Math.random()*5);
      else grid[i]=-1;
    }
  }
  function fullLines(){
    var rows=[],cols=[],i,r,c,full;
    for(r=0;r<8;r++){ full=true; for(c=0;c<8;c++){ if(grid[r*8+c]<0){full=false;break;} } if(full) rows.push(r); }
    for(c=0;c<8;c++){ full=true; for(r=0;r<8;r++){ if(grid[r*8+c]<0){full=false;break;} } if(full) cols.push(c); }
    return {rows:rows,cols:cols};
  }
  function renderHistory(){
    if(!history.length){ histEl.innerHTML='<p class="text-zinc-600">Nenhuma rodada ainda.</p>'; return; }
    histEl.innerHTML=history.map(function(h){
      var right=h.ganho>0?'+'+fmt(h.ganho):'-'+fmt(h.bet);
      var cls=h.ganho>0?'text-green-400':'text-zinc-500';
      return '<div class="flex justify-between border-b border-white/5 py-1"><span>'+h.hora+' • '+fmt(h.bet)+'</span><span class="'+cls+'">'+right+'</span></div>';
    }).join('');
  }
  function save(){ try{ localStorage.setItem(ownerKey(),String(saldo)); }catch(e){} }
  function load(){
    try{
      var u=JSON.parse(localStorage.getItem('profits_user')||'{}');
      if(!u.email){ document.getElementById('authBar').classList.remove('hidden'); }
    }catch(e){}
    try{
      var s=parseFloat(localStorage.getItem(ownerKey()));
      if(!isNaN(s)) saldo=s;
    }catch(e){}
  }
  function setBet(v){ bet=v; paint(); }
  document.getElementById('betMinus').addEventListener('click',function(){
    var i=BETS.indexOf(bet); setBet(BETS[Math.max(0,i-1)]);
  });
  document.getElementById('betPlus').addEventListener('click',function(){
    var i=BETS.indexOf(bet); setBet(BETS[Math.min(BETS.length-1,i+1)]);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.betQuick'),function(b){
    b.addEventListener('click',function(){ setBet(parseFloat(b.getAttribute('data-bet'))); });
  });

  btn.addEventListener('click',function(){
    if(btn.disabled) return;
    if(saldo<bet){ msgEl.textContent='Saldo insuficiente. Faça depósito.'; return; }
    btn.disabled=true; btn.textContent='GIRANDO...'; boardEl.classList.add('playing');
    saldo-=bet; round++; msgEl.textContent='';
    setTimeout(function(){
      fillRandom();
      var lines=fullLines();
      var idx=[];
      lines.rows.forEach(function(r){ for(var c=0;c<8;c++) idx.push(r*8+c); });
      lines.cols.forEach(function(c){ for(var r=0;r<8;r++) idx.push(r*8+c); });
      var nLines=lines.rows.length+lines.cols.length;
      render(idx);
      var ganho=0;
      if(nLines>0){
        ganho=bet*(1+nLines*1.5);
        ganho=Math.round(ganho*100)/100;
        saldo=Math.round((saldo+ganho)*100)/100;
        msgEl.textContent='GANHOU '+fmt(ganho)+' ('+nLines+' linhas)';
        msgEl.className='text-xs text-center text-green-400 h-4 mt-2 font-bold';
        idx.forEach(function(i){ grid[i]=-1; });
        setTimeout(function(){ render([]); },650);
      } else {
        msgEl.textContent='Sem linha completa. Tente de novo.';
        msgEl.className='text-xs text-center text-zinc-400 h-4 mt-2';
      }
      history.unshift({bet:bet,ganho:ganho,hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
      if(history.length>8) history.pop();
      renderHistory(); paint(); save();
      boardEl.classList.remove('playing');
      btn.disabled=false; btn.textContent='GIRAR';
    },650);
  });

  load(); emptyGrid(); fillRandom(); render([]); renderHistory(); paint();
})();
</script>
</body>
</html>
