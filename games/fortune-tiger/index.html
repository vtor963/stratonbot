<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat+Brush&amp;&amp;family=Open+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap"
      rel="stylesheet"
    />
    <title>Fortune Tiger | StratonPay Bets</title>
    <style>
      #btnBack{position:absolute;top:10px;left:10px;z-index:20;width:38px;height:38px;border-radius:9999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:#fff;font-size:18px;font-weight:900;cursor:pointer;line-height:1}
      #btnTurbo{position:absolute;top:10px;right:10px;z-index:20;width:42px;height:42px;border-radius:9999px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .12s}
      #btnTurbo:active{transform:scale(.92)}
      #btnTurbo.on{border-color:#facc15;box-shadow:0 0 14px rgba(250,204,21,.65);color:#facc15}
      #btnTurbo small{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;letter-spacing:.08em;color:#facc15;opacity:.9}
      #btnTurbo svg{width:20px;height:20px}
      #aposta{cursor:pointer;user-select:none;transition:transform .1s}
      #aposta:active{transform:scale(.96)}
    </style>
  </head>
  <body>
    <div class="content">
      <button id="btnBack" title="Voltar">&#8592;</button>
      <button id="btnTurbo" title="Turbo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg><small>TURBO</small></button>
      <div class="stage1">
        <div class="positionBtn">
          <p>Você ganhou 3 rodadas grátis no Fortune Tiger !</p>
          <div class="start-button">
            <div class="start-button-inner">Começar</div>
          </div>
        </div>
      </div>
      <div class="stage2">
        <video
          class="video"
          autoplay="autoplay"
          playsinline=""
          loop=""
          muted=""
          src="media/top3.webm"
          width="569"
        >
          <img src="images/topstatic.webp" alt="" width="569" height="211" />
        </video>
        <div class="sorterSpace">
          <div class="ganhoCols" id="ganhoCols1">
            <div class="laranja">
              <img src="images/orange.webp" width="135" height="138" />
            </div>
            <div class="laranja">
              <img src="images/orange.webp" width="135" height="138" />
            </div>
            <div class="laranja">
              <img src="images/orange.webp" width="135" height="138" />
            </div>
          </div>

          <div class="ganhoCols" id="ganhoCols2">
            <div class="laranja">
              <img src="images/tesouro.webp" width="105" height="138" />
            </div>
            <div class="laranja">
              <img src="images/tesouro.webp" width="135" height="138" />
            </div>
            <div class="laranja">
              <img src="images/tesouro.webp" width="135" height="138" />
            </div>
            <div class="laranja">
              <img src="images/tesouro.webp" width="135" height="138" />
            </div>
            <div class="laranja">
              <img src="images/tesouro.webp" width="135" height="138" />
            </div>
            <div class="laranja">
              <img src="images/tesouro.webp" width="135" height="138" />
            </div>
            <div class="laranja">
              <img src="images/fichas.webp" width="135" height="138" />
            </div>
            <div class="laranja">
              <img src="images/fichas.webp" width="135" height="138" />
            </div>
            <div class="laranja">
              <img src="images/fichas.webp" width="135" height="138" />
            </div>
            <div class="line1" style="top: 18%"></div>
            <div class="line1" style="top: 83%"></div>
          </div>

          <div class="col">
            <div class="els" id="col1"></div>
          </div>
          <div class="col">
            <div class="els elsbottom col2" id="col2"></div>
          </div>
          <div class="col">
            <div class="els elscenter col3" id="col3"></div>
          </div>
        </div>
        <div class="marquee">
          <div class="allmarquee">
            <div class="marqueeSpace">
              <span>Novas rodadas na funcionalidade Tigre da Sorte!</span>
            </div>
            <div class="marqueeSpace hidden">
              <span>Multiplicador x10 com cilindros repletos de ganhos!</span>
            </div>
            <div class="marqueeSpace hidden">
              <span>Ganhe até 2500x</span>
            </div>
          </div>

          <div class="ganho" id="ganho1">
            <span>Ganho R$2.00</span>
          </div>
          <div class="speedlight"></div>
        </div>
        <div class="total">
          <div class="input" id="carteira">R$20.00</div>
          <div class="input" id="aposta" title="Toque para trocar a aposta">R$2.00</div>
          <div class="input" id="total">R$0.00</div>
        </div>
        <div class="footer">
          <div id="spinButton" class="spin rotate"></div>
          <div class="stars"></div>
        </div>
      </div>

      <div class="grandeGanho">
        <div class="spaceGanho">
          <img
            src="images/grande-ganho.webp"
            id="grandeGanhoImg"
            width="569"
            height="533"
            alt=""
          />
          <img
            src="images/mega-ganho.webp"
            id="megaGanhoImg"
            width="569"
            height="598"
            alt=""
            style="margin-top: -3%"
          />
          <img
            src="images/super-mega-ganho2.webp"
            id="superMegaGanhoImg"
            width="818"
            height="896"
            alt=""
            style="margin-top: -22%"
          />
          <div class="contador shake" id="cont1">0</div>
          <div class="ultimoPremio" id="cont2">
            <div class="btnFim">
              <button class="btnFim-inner" id="btnResgatar">
                RESGATAR PRÊMIO
              </button>
            </div>
          </div>
        </div>
        <div class="circle"></div>
        <div class="bgGanho">
          <img src="images/bright.webp" width="1020" height="1020" alt="" />
        </div>
      </div>
    </div>
    <audio id="bgSound" autoplay="" loop="">
      <source src="media/bgsound.ogg" type="audio/mpeg" />
    </audio>
    <audio id="clickSound">
      <source src="media/clickbtn.ogg" type="audio/mpeg" />
    </audio>
    <audio id="spinSound">
      <source src="media/spin4.ogg" type="audio/mpeg" />
    </audio>
    <audio id="spinSound2">
      <source src="media/spin2.ogg" type="audio/mpeg" />
    </audio>
    <audio id="coinsSound">
      <source src="media/coins.ogg" type="audio/mpeg" />
    </audio>
    <audio id="win1"><source src="media/win1.ogg" type="audio/mpeg" /></audio>
    <audio id="bigWinSound">
      <source src="media/bigwin.ogg" type="audio/mpeg" />
    </audio>
    <audio id="fogosSound" loop="">
      <source src="media/fogos.ogg" type="audio/mpeg" />
    </audio>
    <audio id="levelupSound">
      <source src="media/level-up.ogg" type="audio/mpeg" />
    </audio>
    <audio id="levelupSound2">
      <source src="media/level-up2.ogg" type="audio/mpeg" />
    </audio>
    <script src="script.js"></script>
  </body>
</html>
