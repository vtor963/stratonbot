<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Double | StratonPay Bets</title>
<link rel="icon" href="../../public/logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:Inter,system-ui,sans-serif}
body{background:#0f1923;color:#fff}
.stage{background:#1d2730;border:1px solid rgba(255,255,255,.08)}
.roulette{overflow:hidden;position:relative}
.strip{display:flex;gap:8px;transition:transform 4s cubic-bezier(.12,.8,.08,1);will-change:transform}
.cell{min-width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:20px;flex-shrink:0}
.cell.red{background:#dc2626}
.cell.black{background:#111827;border:1px solid rgba(255,255,255,.15)}
.cell.white{background:#f8fafc;color:#111}
.cell.pick{outline:3px solid #f5b301}
.btn-red{background:#dc2626}
.btn-black{background:#111827;border:1px solid rgba(255,255,255,.2)}
.btn-white{background:#f8fafc;color:#111}
.btn-bet{background:#8cb506;color:#fff;box-shadow:0 6px 0 #3f6212}
.btn-bet:active{transform:translateY(3px);box-shadow:0 3px 0 #3f6212}
.btn-bet:disabled{opacity:.5}
input{color:#111}
.hist-dot{font-variant-numeric:tabular-nums}
.pointer{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#f5b301;transform:translateX(-50%)}
</style>
</head>
<body class="min-h-screen">
<header class="h-14 bg-[#1d2730] border-b border-white/10 flex items-center justify-between px-4 sticky top-0 z-10">
  <a href="../index.html" class="flex items-center gap-2">
    <img src="../../public/logo.png" class="w-8 h-8 rounded-lg object-cover" alt="StratonPay">
    <span class="font-extrabold">Double</span>
  </a>
  <div class="flex items-center gap-2">
    <div class="bg-black/40 px-3 py-1.5 rounded-full border border-white/10 text-sm">Saldo <b id="saldo">R$ 100,00</b></div>
    <a href="../index.html" class="px-3 py-1.5 bg-white text-black rounded-full text-xs font-bold">Jogos</a>
  </div>
</header>

<main class="max-w-[720px] mx-auto p-3 pb-10">
  <div class="stage rounded-2xl p-4">
    <p class="text-xs font-bold text-white/60 text-center">RESULTADO ANTERIOR <b id="last" class="text-white">aguarde</b></p>
    <div class="roulette mt-3 py-2">
      <div class="pointer"></div>
      <div id="strip" class="strip"></div>
    </div>
    <p id="fase" class="text-center text-xs font-bold text-white/70 mt-2">Escolha a cor e clique em APOSTAR. Giro a cada rodada.</p>
    <div id="hist" class="flex gap-1.5 mt-3 flex-wrap justify-center text-xs"></div>
  </div>

  <div class="bg-[#1d2730] rounded-2xl p-4 mt-3 border border-white/10">
    <div class="grid grid-cols-3 gap-2">
      <button data-cor="red" class="corBtn btn-red h-12 rounded-xl font-extrabold text-sm">Vermelho 2x</button>
      <button data-cor="white" class="corBtn btn-white h-12 rounded-xl font-extrabold text-sm">Branco 14x</button>
      <button data-cor="black" class="corBtn btn-black h-12 rounded-xl font-extrabold text-sm">Preto 2x</button>
    </div>
    <div class="flex items-center gap-2 mt-3">
      <button id="btnMinus" class="w-10 h-11 rounded-xl bg-white/10 font-black">-</button>
      <input id="valor" type="number" value="10" min="1" class="h-11 w-full rounded-xl px-3 text-sm text-black">
      <button id="btnPlus" class="w-10 h-11 rounded-xl bg-white/10 font-black">+</button>
    </div>
    <div class="flex gap-2 mt-2 text-xs font-bold">
      <button id="btnHalf" class="flex-1 h-8 rounded-full bg-white/10">1/2</button>
      <button id="btnDouble" class="flex-1 h-8 rounded-full bg-white/10">x2</button>
      <button id="btnMax" class="flex-1 h-8 rounded-full bg-white/10">MAX</button>
    </div>
    <button id="btnGo" class="btn-bet w-full h-12 rounded-xl font-black text-sm mt-3">APOSTAR</button>
    <p id="msg" class="text-xs text-white/60 mt-2 text-center">Branco paga 14x. Vermelho e preto pagam 2x.</p>
  </div>
  <p class="text-[11px] text-white/40 mt-3 text-center">Jogue com responsabilidade. Mais 18.</p>
</main>

<script type="module">
const params = new URLSearchParams(location.search);
const platformId = params.get('platform') || 'demo';
const PKEY = 'player_' + platformId;
const fmt = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let saldo = 100;
try{ const p = JSON.parse(localStorage.getItem(PKEY)||'null'); if(p && typeof p.saldo === 'number') saldo = p.saldo; }catch{}
function saveSaldo(){
  try{ const p = JSON.parse(localStorage.getItem(PKEY)||'{}'); p.saldo = saldo; localStorage.setItem(PKEY, JSON.stringify(p)); }catch{}
  document.getElementById('saldo').textContent = fmt(saldo);
}
async function logBet(b){
  try{ const { sbCreateBet } = await import('../../supabase.js'); await sbCreateBet({ platform_id: platformId, jogo:'double', ...b }); }catch{}
}
saveSaldo();

const ORDER = ['red','red','black','black','red','black','red','white','black','red','black','black','red','black','white'];
function numOf(cor, i){ if(cor==='white') return 0; return (i % 14) + 1; }
const strip = document.getElementById('strip');
function buildStrip(){
  strip.style.transition = 'none'; strip.style.transform = 'translateX(0)';
  strip.innerHTML = '';
  for(let r=0;r<4;r++){
    ORDER.forEach((c,i)=>{
      const d = document.createElement('div');
      d.className = 'cell ' + c;
      d.textContent = numOf(c, i);
      strip.appendChild(d);
    });
  }
}
buildStrip();

let pick = 'red', aposta = 0, girando = false;
document.querySelectorAll('.corBtn').forEach(b=>{
  b.onclick = ()=>{
    if(girando) return;
    pick = b.dataset.cor;
    document.querySelectorAll('.corBtn').forEach(x=>x.classList.remove('pick'));
    b.classList.add('pick');
  };
});
document.querySelector('.corBtn[data-cor="red"]').classList.add('pick');

const valorEl = document.getElementById('valor');
document.getElementById('btnMinus').onclick = ()=>{ valorEl.value = Math.max(1, Number(valorEl.value||1)-1); };
document.getElementById('btnPlus').onclick = ()=>{ valorEl.value = Math.min(500, Number(valorEl.value||1)+1); };
document.getElementById('btnHalf').onclick = ()=>{ valorEl.value = Math.max(1, Math.floor(Number(valorEl.value||2)/2)); };
document.getElementById('btnDouble').onclick = ()=>{ valorEl.value = Math.min(500, Number(valorEl.value||1)*2); };
document.getElementById('btnMax').onclick = ()=>{ valorEl.value = Math.min(500, Math.max(1, Math.floor(saldo))); };

function pushHist(cor, n){
  const d = document.createElement('span');
  d.className = 'hist-dot w-8 h-8 rounded-full grid place-items-center font-black ' + (cor==='red' ? 'bg-red-600' : cor==='white' ? 'bg-white text-black' : 'bg-black border border-white/20');
  d.textContent = n;
  const h = document.getElementById('hist');
  h.prepend(d);
  while(h.children.length > 14) h.lastChild.remove();
}
[7,3,0,11,5].forEach((n,i)=>pushHist(i===2?'white':(n%2?'red':'black'), n));

function beep(f,d){
  try{
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext||window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.frequency.value = f; o.type='sine';
    g.gain.setValueAtTime(.12, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+d);
    o.start(); o.stop(ctx.currentTime+d);
  }catch{}
}

document.getElementById('btnGo').onclick = async ()=>{
  if(girando) return;
  const v = Number(valorEl.value||0);
  if(!(v>0)){ alert('Informe o valor'); return; }
  if(v > saldo){ alert('Saldo insuficiente. Deposite para continuar.'); return; }
  saldo = Math.round((saldo - v)*100)/100; saveSaldo();
  aposta = v; girando = true;
  document.getElementById('fase').textContent = 'Girando. Boa sorte.';
  document.getElementById('btnGo').disabled = true;

  const roll = Math.random();
  let winCor;
  if(pick === 'white'){ winCor = roll > 0.94 ? 'white' : (Math.random() < .5 ? 'red' : 'black'); }
  else { winCor = roll > 0.485 ? pick : (pick === 'red' ? 'black' : 'red'); if(Math.random() < 0.035) winCor = 'white'; }

  const targetIdx = 30 + Math.floor(Math.random()*15);
  const cells = [...strip.children];
  const winNum = winCor === 'white' ? 0 : numOf(winCor, targetIdx % 15);
  cells[targetIdx].textContent = winNum;
  cells[targetIdx].className = 'cell ' + winCor;
  const x = targetIdx * 72 - strip.clientWidth/2 + 32;
  requestAnimationFrame(()=>{ strip.style.transition = 'transform 4s cubic-bezier(.12,.8,.08,1)'; strip.style.transform = `translateX(${-x}px)`; });
  beep(440,.12);

  setTimeout(async ()=>{
    const win = winCor === pick;
    const mult = win ? (pick === 'white' ? 14 : 2) : 0;
    const ret = Math.round(aposta*mult*100)/100;
    if(win){ saldo = Math.round((saldo+ret)*100)/100; saveSaldo(); beep(880,.15); }
    else beep(160,.25);
    document.getElementById('last').textContent = winNum + ' ' + winCor;
    document.getElementById('fase').textContent = win ? 'Ganhou ' + fmt(ret-aposta) + ' com ' + pick : 'Perdeu ' + fmt(aposta) + '. Saiu ' + winCor;
    document.getElementById('msg').textContent = win ? 'Lucro de ' + fmt(ret-aposta) + ' creditado.' : 'Tente de novo com calma.';
    pushHist(winCor, winNum);
    logBet({ valor: aposta, multiplicador: mult, retorno: win?ret:0, resultado: win?'win':'loss' });
    aposta = 0; girando = false;
    document.getElementById('btnGo').disabled = false;
    setTimeout(buildStrip, 1500);
  }, 4200);
};
</script>
</body>
</html>
