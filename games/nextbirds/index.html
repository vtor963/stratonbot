<script>
// Sandbox: o jogo original fala com api.* do site antigo (fora do ar).
// Interceptamos e devolvemos respostas neutras para rodar 100% offline.
(function(){
  const API = /api\.|nextbirds\.pro|\/info$|\/user$|\/transfer|\/withdraw|\/pix|\/status|\/gains|\/rollover|\/tracking|\/chat|\/jackpot|\/bonus/;
  const fake = { ok:true, status:'ok', balance:100, token:'local', user:{name:'Jogador'}, data:{}, list:[] };
  const JR = (o)=>new Response(JSON.stringify(o),{status:200,headers:{'Content-Type':'application/json'}});
  const _fetch = window.fetch.bind(window);
  window.fetch = (url, opts)=>{
    try{ if(API.test(String(url))){ return Promise.resolve(JR(fake)); } }catch(e){}
    return _fetch(url, opts).catch(()=>JR(fake));
  };
  const _XO = window.XMLHttpRequest;
  window.XMLHttpRequest = function(){
    const x = new _XO(); const _open = x.open;
    x.open = function(m,u){ this._u = String(u); return _open.apply(this,arguments); };
    const _send = x.send;
    x.send = function(){
      if(API.test(this._u||'')){
        Object.defineProperty(x,'status',{value:200}); Object.defineProperty(x,'readyState',{value:4});
        Object.defineProperty(x,'responseText',{value:JSON.stringify(fake)});
        setTimeout(()=>{ x.onreadystatechange && x.onreadystatechange(); x.onload && x.onload(); },10);
        return;
      }
      return _send.apply(this,arguments);
    };
    return x;
  };
  try{
    const WS = window.WebSocket;
    window.WebSocket = function(){ return { send(){}, close(){}, addEventListener(){}, removeEventListener(){}, readyState:1, CONNECTING:0, OPEN:1 }; };
  }catch(e){}
  try{ localStorage.setItem('token','local'); localStorage.setItem('language','pt-BR'); }catch(e){}
  document.getElementById('netstat').textContent = 'valendo';
})();
</script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const platformId = params.get('platform') || 'demo';
  const PKEY = 'player_' + platformId;
  const fmt = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  let saldo = 100;
  try{ const p = JSON.parse(localStorage.getItem(PKEY)||'null'); if(p && typeof p.saldo === 'number') saldo = p.saldo; }catch{}
  const saldoEl = document.getElementById('saldo'), valorEl = document.getElementById('valor'), btn = document.getElementById('btnBet');
  function save(){ try{ const p = JSON.parse(localStorage.getItem(PKEY)||'{}'); p.saldo = saldo; localStorage.setItem(PKEY, JSON.stringify(p)); }catch{} saldoEl.textContent = fmt(saldo); }
  async function logBet(b){ try{ const m = await import('../../supabase.js'); await m.sbCreateBet({ platform_id: platformId, jogo:'nextbirds', ...b }); }catch{} }
  save();
  let aposta = 0, premioPago = false;
  btn.onclick = async ()=>{
    const v = Number(valorEl.value||0);
    if(!(v>0)){ alert('Informe o valor'); return; }
    if(v > saldo){ alert('Saldo insuficiente. Deposite para continuar.'); return; }
    saldo = Math.round((saldo - v)*100)/100; save();
    aposta = v; premioPago = false;
    btn.textContent = 'JOGANDO ' + fmt(v);
    document.getElementById('netstat').textContent = 'valendo ' + fmt(v);
    setTimeout(async ()=>{
      if(aposta > 0 && !premioPago){
        premioPago = true;
        const win = Math.random() < 0.40;
        if(win){
          const ret = Math.round(aposta*2*100)/100;
          saldo = Math.round((saldo + ret)*100)/100; save();
          logBet({ valor: aposta, multiplicador: 2, retorno: ret, resultado: 'win' });
          document.getElementById('netstat').textContent = 'premio ' + fmt(ret);
        } else {
          logBet({ valor: aposta, multiplicador: 0, retorno: 0, resultado: 'loss' });
          document.getElementById('netstat').textContent = 'sem premio';
        }
        btn.textContent = 'JOGAR ' + (valorEl.value||5);
        aposta = 0;
      }
    }, 45000);
  };
})();
</script>
