<script>
// Sandbox: o jogo original fala com api.* do site antigo (fora do ar).
// Interceptamos e devolvemos respostas neutras para rodar 100% offline.
(function(){
  const API = /api\.|nextbirds\.pro|\/info$|\/user$|\/transfer|\/withdraw|\/pix|\/status|\/gains|\/rollover|\/tracking|\/chat|\/jackpot|\/bonus/;
  const fake = { ok:true, status:'ok', balance:100, token:'local', user:{name:'Jogador'}, data:{}, list:[] };
  const JR = (o)=>new Response(JSON.stringify(o),{status:200,headers:{'Content-Type':'application/json'}});
  const _fetch = window.fetch.bind(window);
  window.fetch = (url, opts)=>{
    try{ if(API.test(String(url))){ return Promise.resolve(JR(fake)); } }catch(e){}
    return _fetch(url, opts).catch(()=>JR(fake));
  };
  const _XO = window.XMLHttpRequest;
  window.XMLHttpRequest = function(){
    const x = new _XO(); const _open = x.open;
    x.open = function(m,u){ this._u = String(u); return _open.apply(this,arguments); };
    const _send = x.send;
    x.send = function(){
      if(API.test(this._u||'')){
        Object.defineProperty(x,'status',{value:200}); Object.defineProperty(x,'readyState',{value:4});
        Object.defineProperty(x,'responseText',{value:JSON.stringify(fake)});
        setTimeout(()=>{ x.onreadystatechange && x.onreadystatechange(); x.onload && x.onload(); },10);
        return;
      }
      return _send.apply(this,arguments);
    };
    return x;
  };
  try{
    const WS = window.WebSocket;
    window.WebSocket = function(){ return { send(){}, close(){}, addEventListener(){}, removeEventListener(){}, readyState:1, CONNECTING:0, OPEN:1 }; };
  }catch(e){}
  try{ localStorage.setItem('token','local'); localStorage.setItem('language','pt-BR'); }catch(e){}
  document.getElementById('netstat').textContent = 'modo offline (sem apostas)';
})();
</script>
