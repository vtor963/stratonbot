<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caixa Misteriosa | StratonPay Bets</title>
<link rel="icon" href="../../public/logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:Inter,system-ui,sans-serif}
body{background:#0f0a22;color:#fff}
.chest{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 0%, #3b2273 0%, #1d1238 60%);border:1px solid rgba(255,255,255,.12);transition:transform .15s ease, box-shadow .15s ease}
.chest:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.chest.open{background:linear-gradient(180deg,#3b2273,#1d1238)}
.chest.winner{background:radial-gradient(ellipse at 50% 0%, #16a34a 0%, #14532d 60%);border-color:#22c55e;box-shadow:0 0 22px 4px rgba(34,197,94,.55)}
.chest img{width:100%;height:118px;object-fit:cover;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.chest::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, transparent 40%, rgba(0,0,0,.25));pointer-events:none}
.btn-open{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;box-shadow:0 8px 22px -8px #a855f7}
.btn-open:active{transform:translateY(2px)}
.btn-open:disabled{opacity:.5}
input{color:#111}
input[type=number]{background:rgba(255,255,255,.08)!important;color:#fff!important;border:1px solid rgba(255,255,255,.18)!important;color-scheme:dark}
@keyframes chestpop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.pop{animation:chestpop .32s ease}
@keyframes coinrain{0%{transform:translateY(-24px) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(24px) scale(1);opacity:0}}
.coin{position:absolute;width:22px;height:22px;border-radius:999px;background:radial-gradient(circle at 30% 30%, #fef08a, #eab308);border:2px solid #a16207;animation:coinrain .9s ease forwards}
</style>
</head>
<body class="min-h-screen">
<header class="h-14 bg-[#1d1238] border-b border-white/10 flex items-center justify-between px-4 sticky top-0 z-10">
  <a href="#" onclick="if(history.length>1){history.back()}else{location.href='../../p.html?demo=6666'}return false;" class="flex items-center gap-2">
    <img src="../../public/logo.png" class="w-8 h-8 rounded-lg object-cover" alt="StratonPay">
    <span class="font-extrabold">Caixa Misteriosa</span>
  </a>
  <div class="flex items-center gap-2">
    <div class="bg-black/40 px-3 py-1.5 rounded-full border border-white/10 text-sm">Saldo <b id="saldo">R$ 100,00</b></div>
  </div>
</header>

<main class="max-w-[520px] mx-auto p-4 pb-10">
  <div class="bg-[#1d1238] rounded-2xl p-4 border border-white/10 text-center">
    <p class="font-extrabold text-lg">Escolha 1 de 3 caixas</p>
    <p class="text-xs text-white/60 mt-1">Premios de 0x a 10x. Uma caixa por rodada.</p>
    <div id="boxes" class="grid grid-cols-3 gap-3 mt-4"></div>
    <p id="msg" class="text-sm mt-3 text-white/70">Defina o valor e clique em ABRIR.</p>
  </div>

  <div class="bg-[#1d1238] rounded-2xl p-4 mt-3 border border-white/10">
    <div class="flex items-center gap-2">
      <button id="btnMinus" class="w-10 h-11 rounded-xl bg-white/10 font-black">-</button>
      <input id="valor" type="number" value="10" min="1" class="h-11 w-full rounded-xl px-3 text-sm text-black">
      <button id="btnPlus" class="w-10 h-11 rounded-xl bg-white/10 font-black">+</button>
    </div>
    <button id="btnGo" class="btn-open w-full h-12 rounded-xl font-black text-sm mt-3">ABRIR CAIXAS</button>
    <div class="grid grid-cols-3 gap-1 mt-3 text-center text-[11px] text-white/60">
      <div class="bg-white/5 rounded-lg py-1.5">0x <span>vazia</span></div>
      <div class="bg-white/5 rounded-lg py-1.5">1.5x a 2x <span>comum</span></div>
      <div class="bg-white/5 rounded-lg py-1.5">5x e 10x <span>rara</span></div>
    </div>
  </div>
  <div id="hist" class="flex gap-1.5 mt-3 flex-wrap justify-center text-xs"></div>
  <p class="text-[11px] text-white/40 mt-3 text-center">Jogue com responsabilidade. Mais 18.</p>
</main>

<script type="module">
const params = new URLSearchParams(location.search);
const platformId = params.get('platform') || 'demo';
const PKEY = 'player_' + platformId;
const fmt = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let saldo = 100;
try{ const p = JSON.parse(localStorage.getItem(PKEY)||'null'); if(p && typeof p.saldo === 'number') saldo = p.saldo; }catch{}
function save(){ try{ const p = JSON.parse(localStorage.getItem(PKEY)||'{}'); p.saldo = saldo; localStorage.setItem(PKEY, JSON.stringify(p)); }catch{} document.getElementById('saldo').textContent = fmt(saldo); }
async function logBet(b){ try{ const m = await import('../../supabase.js'); await m.sbCreateBet({ platform_id: platformId, jogo:'caixa', ...b }); }catch{} }
save();

const SVG_CHEST = '';
const IMG_BAU = './../../public/layouts/lootbox.png';
const IMG_BAU2 = './../../public/layouts/lootbox2.png';
const boxesEl = document.getElementById('boxes'), msgEl = document.getElementById('msg');
const valorEl = document.getElementById('valor'), btnGo = document.getElementById('btnGo');
let aposta = 0, aberta = false, premios = [];

function sortear(){
  const r = Math.random()*100;
  if(r < 40) return 0;
  if(r < 70) return 1.5;
  if(r < 85) return 2;
  if(r < 95) return 5;
  return 10;
}
function renderBoxes(){
  boxesEl.innerHTML = '';
  for(let i=0;i<3;i++){
    const b = document.createElement('button');
    b.className = 'chest pop';
    b.innerHTML = '<img src="' + (i===1?IMG_BAU2:IMG_BAU) + '" alt="bau"><span class="absolute bottom-2 left-1/2 -translate-x-1/2 text-xs font-black bg-black/60 px-2 py-1 rounded-full">Caixa ' + (i+1) + '</span><span class="text-[11px] text-white/50" data-res></span>';
    b.disabled = true;
    b.onclick = ()=>pick(i);
    boxesEl.appendChild(b);
  }
}
function pushHist(win, txt){
  const d = document.createElement('span');
  d.className = 'px-2 py-1 rounded-full font-bold ' + (win ? 'bg-green-500/25 text-green-200' : 'bg-red-500/25 text-red-200');
  d.textContent = txt;
  const h = document.getElementById('hist');
  h.prepend(d);
  while(h.children.length > 20) h.lastChild.remove();
}
renderBoxes();

document.getElementById('btnMinus').onclick = ()=>{ valorEl.value = Math.max(1, Number(valorEl.value||1)-1); };
document.getElementById('btnPlus').onclick = ()=>{ valorEl.value = Math.min(500, Number(valorEl.value||1)+1); };

btnGo.onclick = ()=>{
  if(aberta) return;
  const v = Number(valorEl.value||0);
  if(!(v>0)){ alert('Informe o valor'); return; }
  if(v > saldo){ alert('Saldo insuficiente. Deposite para continuar.'); return; }
  saldo = Math.round((saldo - v)*100)/100; save();
  aposta = v; aberta = true;
  const winIdx = Math.floor(Math.random()*3);
  premios = [0,0,0].map((_,i)=> i === winIdx ? sortear() : 0);
  if(premios[winIdx] === 0){
    const alt = [1.5,2,5][Math.floor(Math.random()*3)];
    if(Math.random() < 0.5) premios[winIdx] = alt;
  }
  [...boxesEl.children].forEach(b=> b.disabled = false);
  msgEl.textContent = 'Caixas prontas. Escolha 1.';
  btnGo.disabled = true;
};
async function pick(i){
  if(!aberta) return;
  aberta = false;
  const m = premios[i];
  const ret = Math.round(aposta*m*100)/100;
  [...boxesEl.children].forEach((b,j)=>{
    b.disabled = true;
    b.classList.add('open');
    const res = b.querySelector('[data-res]');
    if(j === i){
      if(m > 0){ b.classList.add('winner'); res.textContent = m + 'x = ' + fmt(ret); }
      else res.textContent = 'vazia';
    } else {
      res.textContent = premios[j] > 0 ? 'tinha ' + premios[j] + 'x' : 'vazia';
      b.style.opacity = '.55';
    }
  });
  if(m > 0){
    saldo = Math.round((saldo + ret)*100)/100; save();
    msgEl.textContent = 'Premio ' + m + 'x. Retorno ' + fmt(ret) + '.';
    logBet({ valor: aposta, multiplicador: m, retorno: ret, resultado: 'win' });
    pushHist(true, '+' + m + 'x');
    const b = boxesEl.children[i];
    for(let k=0;k<8;k++){ const c=document.createElement('div'); c.className='coin'; c.style.left=(30+k*28)+'px'; c.style.top='20px'; b.appendChild(c); setTimeout(()=>c.remove(),950); }
  } else {
    msgEl.textContent = 'Caixa vazia. Voce perdeu ' + fmt(aposta) + '.';
    logBet({ valor: aposta, multiplicador: 0, retorno: 0, resultado: 'loss' });
    pushHist(false, '-' + fmt(aposta));
  }
  aposta = 0;
  btnGo.disabled = false;
  setTimeout(()=>{ renderBoxes(); }, 4000);
}
</script>
</body>
</html>
